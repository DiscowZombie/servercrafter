# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: servercrafter

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/servercrafter
    binary: servercrafter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # bootstrap execs the server process, which requires a Unix system
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - schemas/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
